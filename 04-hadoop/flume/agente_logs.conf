# Agente Flume a1: vigila un log y lo escribe en HDFS (M7)
a1.sources = r1
a1.channels = c1
a1.sinks = k1

# Source: toma las lineas nuevas del archivo
a1.sources.r1.type = TAILDIR
a1.sources.r1.filegroups = f1
a1.sources.r1.filegroups.f1 = /tmp/app_vivo.log
a1.sources.r1.positionFile = /tmp/flume_taildir_pos.json
a1.sources.r1.channels = c1

# Channel: cola en memoria
a1.channels.c1.type = memory
a1.channels.c1.capacity = 1000
a1.channels.c1.transactionCapacity = 100

# Sink: escribe en HDFS, un archivo nuevo cada 30 segundos
a1.sinks.k1.type = hdfs
a1.sinks.k1.channel = c1
a1.sinks.k1.hdfs.path = hdfs://namenode:8020/nexo/bronze/logs
a1.sinks.k1.hdfs.filePrefix = app
a1.sinks.k1.hdfs.fileSuffix = .log
a1.sinks.k1.hdfs.fileType = DataStream
a1.sinks.k1.hdfs.writeFormat = Text
a1.sinks.k1.hdfs.rollInterval = 30
a1.sinks.k1.hdfs.rollSize = 0
a1.sinks.k1.hdfs.rollCount = 0 